{% extends "base.html" %}
{% block title %}Sign In | JFCM Library{% endblock %}
{% block content %}
<main class="auth-page login-page">
  <section class="auth-card">
    <a class="brand" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='images/JF.png') }}" alt="JFCM" class="brand-logo">
    </a>
    <h1>Jesus First Christian Ministries</h1>
    <p class="muted">JFCM Library</p>
    <form method="post" class="stack-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="identifier">Email or Username</label>
      <input id="identifier" name="identifier" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">
          <i class="bi bi-eye" aria-hidden="true"></i>
        </button>
      </div>
      <button class="button log" type="submit">Sign in</button>
    </form>
    <!-- <p class="auth-switch">New here? <a href="{{ url_for('register') }}" class="acc">Create an account</a></p> -->
    {% include "_legal_links.html" %}
  </section>
</main>
{% endblock %}
