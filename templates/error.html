{% extends "base.html" %}
{% block title %}Error | Library{% endblock %}
{% block content %}
<main class="auth-page"><section class="auth-card">

        <img src="{{ url_for('static', filename='images/JF.png') }}" alt="File Storage Logo" class="brand-logo" style="height: 36px; width: auto; aspect-ratio: 1/1; align-items: center;">
