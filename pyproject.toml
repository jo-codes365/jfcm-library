[project]
name = "jfcm-library"
version = "0.1.0"
description = "JFCM Library Flask application packaged for Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-WTF>=1.2,<2.0",
    "mysql-connector-python>=9.0,<10.0",
    "python-dotenv>=1.0,<2.0",
    "Werkzeug>=3.0,<4.0",
    "WTForms>=3.0,<4.0",
    "google-auth>=2.0,<3.0",
    "PyMuPDF>=1.24.4,<2.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
